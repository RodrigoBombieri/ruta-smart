name: rutasmart
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: rutasmart
      POSTGRES_USER: rutasmart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rutasmart -d rutasmart"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=db;Database=rutasmart;Username=rutasmart;Password=${POSTGRES_PASSWORD}
      Routing__Enabled: ${ROUTING_ENABLED:-false}
      Routing__PersistenceApproved: ${ROUTING_PERSISTENCE_APPROVED:-false}
      Routing__ApiKey: ${ORS_API_KEY:-}
      Routing__CoverageWkt: ${COVERAGE_WKT:-}
    ports: ["127.0.0.1:5080:8080"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
